name: CI

# Two jobs, both Linux, deliberately. Linux is the gate for every memory claim
# (ADR-0003): LeakSanitizer does not exist on macOS/ARM64, so a green macOS
# run was never evidence of no leaks -- only Valgrind on Linux can support
# that claim.
#
# The macOS job that used to run beside this one was removed because it billed
# at 10x the Linux minute rate for a leg that largely duplicated Linux's
# coverage while lacking the one check that matters most. macOS is the primary development
# platform, so it is covered by running `make test` and `make test-memory`
# (ASan, no leak detection) on the laptop before pushing -- see
# docs/building.md. Two things that only the macOS leg used to catch now
# depend on that local run actually happening: `relink-guard` under make 3.81's
# one-second mtime granularity (macOS ships 3.81; this runner has make 4.x),
# and homebrew's chezscheme drifting below $CHEZ_FLOOR_VERSION.
#
# Both acquisition paths are exercised on every run (ADR-0001): pkg-config
# and the pinned vendored submodule. Nothing here treats the vendored path as
# an afterthought -- it is Windows's eventual primary path (ADR-0004) too.
# The second job runs the pkg-config path against the libuv floor itself,
# Ubuntu 24.04's 1.48 (#90).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# README.org's declared floor. Both jobs assert the Chez they end up with
# actually meets this rather than trusting the resolution step's choice of
# binary -- see the "Assert Chez Scheme meets the declared floor" step in
# .github/actions/pinned-chez.
env:
  CHEZ_FLOOR_VERSION: "10.4.1"

jobs:
  linux:
    name: linux (vendored + valgrind)
    # A named image, not ubuntu-latest: the label moves on GitHub's schedule
    # (to Ubuntu 26.04 from 2026-10-19), and with it the compiler, glibc,
    # Valgrind and the apt libuv the pkg-config leg links. Moving is a commit
    # here, run once in a mirror of this job first. On 26.04: gcc 15.2,
    # cmake 4.2, Valgrind 3.26, libuv 1.51.0 (measured 2026-10-08).
    runs-on: ubuntu-26.04
    # Observed wall clock: ~4min on a Chez-cache hit, ~14min on a cache miss
    # (Chez Scheme built from source -- see .github/actions/pinned-chez). 30min
    # gives headroom over the worst case observed (cache miss + apt install +
    # the valgrind leg, the slowest step here) while still cutting a genuine
    # hang off in minutes instead of GitHub's 360-minute default, which would
    # burn the whole billing budget for nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # chezscheme deliberately absent here -- see the pinned-chez action.
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            valgrind cmake pkg-config build-essential libuv1-dev

      # The pinned Chez, built from source and cached per runner image (see
      # the action for why apt's will not do), asserted to meet the floor,
      # and its binary's name exported as CHEZ.
      - uses: ./.github/actions/pinned-chez
        with:
          chez-version: ${{ env.CHEZ_FLOOR_VERSION }}

      # Recorded rather than asserted: this job's pkg-config leg links
      # whatever libuv the image ships. The floor job below asserts that it
      # links the floor itself.
      - name: Report versions
        run: |
          echo "chez:     $(chezscheme --version 2>&1 || scheme --version 2>&1)"
          echo "valgrind: $(valgrind --version)"
          echo "cmake:    $(cmake --version | head -1)"
          echo "cc:       $(cc --version | head -1)"
          echo "--- pkg-config visibility of libuv ---"
          pkg-config --exists libuv && echo "present: $(pkg-config --modversion libuv)" \
                                     || echo "absent (the vendored path covers this)"

      # The chez-srfi submodule and Akku.lock must name the same commit, and
      # the vendored libuv submodule must fall inside the version range this
      # binding validates at init -- and README.org must state the floor
      # that range is built from. They drifted once already, silently
      # (AGENTS.md's "prefer a check to a comment").
      - name: Check dependency pins agree
        run: make check-pins

      - name: Scheme dependencies
        run: make deps

      - name: Build (pkg-config path)
        run: make build

      - name: Test (pkg-config path)
        run: make test

      - name: Build vendored libuv
        run: make HAVE_PKG=no vendor

      - name: Build (vendored path)
        run: make HAVE_PKG=no build

      # The Makefile's $(ACQ_STAMP) plus `relink-guard` force a relink here:
      # without them, the pkg-config-linked shim above would still be sitting
      # in build/lib and this step would silently test the SAME artifact
      # twice instead of the vendored one. The stamp alone is not enough --
      # it compares mtimes, and make 3.81 does that at one-second granularity
      # (see the guard's comment in the Makefile); this runner's make 4.x
      # would have got away with it.
      - name: Check purity of native-free suites (vendored path)
        run: make HAVE_PKG=no check-purity

      - name: Test (vendored path)
        run: make HAVE_PKG=no test

      # THE SPEC §9.4 / ADR-0016: the setuid/setgid positive tests are
      # excluded from the default `make test` (see ROOT_TESTS in the
      # Makefile) and run only here, under sudo. sudo drops the job's
      # environment, so `env` hands make each variable the lane needs by
      # name: PATH, which this job put the pinned Chez on, and CHEZ, its
      # name (`scheme`), without which make runs `chez`. Not `sudo -E`:
      # Ubuntu 26.04's sudo is sudo-rs, which ignores -E, and the lane
      # failed `chez: not found` there (2026-10-08, reproduced with sudo-rs
      # 0.2.13). `HAVE_PKG=no` matches the vendored-path build just above so
      # test-root's artifact-precondition check accepts what that build
      # produced -- the target deliberately does NOT rebuild (under sudo
      # a `build` prerequisite would relink the shim as root; see the
      # Makefile's test-root comment).
      - name: Root lane (setuid/setgid, sudo)
        run: sudo env "PATH=$PATH" "CHEZ=$CHEZ" make HAVE_PKG=no test-root

      # The gate below proves nothing unless it can fail, and for a month it
      # could not: from #14 (2026-08-30) Valgrind's client was timeout(1), Chez
      # ran unchecked, and this job stayed green (ADR-0003's 2026-09-27
      # amendment). check-memory-gate plants a one-byte heap overrun (by a
      # Scheme store, by libc's memset, and by the C shim's own memcpy behind
      # copy-in!) and a definite leak, runs the real test-memory recipe on
      # each, and requires it to FAIL with Valgrind's own report of that
      # defect. It also plants a possibly-lost block, and
      # requires the gate never to fail on it without printing its loss
      # record. It runs first because it is the precondition for reading the
      # next step's green as evidence.
      - name: Verify the memory gate fails on planted defects
        run: make HAVE_PKG=no check-memory-gate

      # The reason this job exists. Valgrind needs no instrumentation of Chez
      # or libuv and is the only tool in this project that can substantiate a
      # leak claim. Failure here blocks merge.
      - name: Memory (valgrind)
        run: make HAVE_PKG=no test-memory

      # `make test` reporting success on a failing suite would silently void
      # every other check in this workflow, so verify the contract itself.
      # conditions/native/loop are the suites Tasks 4-6 will add; none exist
      # yet at Stage 1a, so this loop has nothing to assert on for
      # suite-masking today and only exercises "make test fails on a failing
      # suite" -- it checks for each file's EXISTENCE at run time, not at the
      # time this workflow was written, so it starts covering suite-masking
      # automatically as they land, with no further edit here.
      - name: Verify the test target fails on a failing suite
        run: |
          mkdir -p tests
          cat > tests/test-aaci-sabotage.sps <<'EOF'
          #!r6rs
          (import (rnrs) (srfi :64))
          (define runner (test-runner-simple))
          (test-runner-current runner)
          (test-begin "ci-sabotage")
          (test-equal "deliberate failure" 1 2)
          (test-end "ci-sabotage")
          (exit (if (zero? (test-runner-fail-count runner)) 0 1))
          EOF
          if make HAVE_PKG=no test > sabotage.log 2>&1; then
            echo "::error::make test exited 0 with a failing suite present"
            rm -f tests/test-aaci-sabotage.sps
            exit 1
          fi
          # A first-position failure (test-aaci-sabotage sorts before every
          # real suite name) must not mask suites that run after it. The
          # test loop's own "=== tests/test-<name>.sps ===" line is a marker
          # it always prints per suite, win or lose, so grepping for it does
          # not depend on that suite having passed.
          for s in conditions native loop; do
            if [ -f "tests/test-$s.sps" ]; then
              grep -q "tests/test-$s.sps" sabotage.log \
                || { echo "::error::suite $s did not run after an earlier failure"; rm -f tests/test-aaci-sabotage.sps; exit 1; }
            else
              echo "tests/test-$s.sps does not exist yet -- skipping (covered automatically once it lands)"
            fi
          done
          rm -f tests/test-aaci-sabotage.sps
          echo "test target correctly failed, and no suite was masked"

      # LAST, because it starts with `make clean`. A release guard that never
      # runs in CI is a comment: this is the step that proves `make prod`
      # really produces a counters-free shim (tests/check-prod.sps fails
      # unless every counter reads zero while a loop and a bound tcp handle
      # are demonstrably alive, and unless the shim exports none of the
      # dev-only pool hold's entries) and that the following `make build`
      # relinks the dev artifact back, rather than leaving a release build in
      # place for dev callers. The dev shim must be refused for both, so
      # neither check can hide the other. pkg-config is present on this
      # runner, so `prod` links against the system libuv and rebuilds
      # nothing vendored.
      - name: Release build guard (make prod -> check-prod)
        run: |
          make prod
          make build
          if make check-prod > check-prod-dev.log 2>&1; then
            cat check-prod-dev.log
            echo "::error::check-prod passed against a dev shim"
            exit 1
          fi
          cat check-prod-dev.log
          grep -q 'FAIL: the counters moved' check-prod-dev.log \
            || { echo "::error::check-prod did not see the dev shim's counters"; exit 1; }
          grep -q 'FAIL: the shim exports the dev-only pool hold' check-prod-dev.log \
            || { echo "::error::check-prod did not see the dev shim's pool hold"; exit 1; }
          echo "check-prod correctly refused the dev shim, for its counters and its pool hold"

  floor:
    name: linux (system libuv at the floor)
    # The libuv floor (the Makefile's UV_FLOOR_*, README.org) is Ubuntu
    # 24.04 LTS's libuv, 1.48.0, and this job runs the suite against exactly
    # that (#90). The job above links 26.04's 1.51.0 and the vendored
    # 1.52.1, so without this no run would test the floor README.org states:
    # the floor was 1.44.0 until #90, and the suite fails two rows on
    # Debian 12's 1.44.2. It runs beside that job, and does only the
    # pkg-config build and `make test`.
    runs-on: ubuntu-24.04
    # ~14min on a Chez-cache miss, as the job above; a few minutes on a hit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libuv1-dev

      - uses: ./.github/actions/pinned-chez
        with:
          chez-version: ${{ env.CHEZ_FLOOR_VERSION }}

      - name: Check dependency pins agree
        run: make check-pins

      - name: Scheme dependencies
        run: make deps

      - name: Build (pkg-config path)
        run: make build

      # What this job is for, checked rather than assumed: the build took the
      # pkg-config path, and the libuv it links is the floor's own major.minor.
      # Should GitHub move 24.04's libuv, or the floor move without this job,
      # this fails by name instead of the job quietly testing another libuv.
      - name: Assert the build links the libuv floor
        run: |
          make -s deps-info | tee deps-info.txt
          source="$(sed -n 's/^libuv source : //p' deps-info.txt)"
          floor="$(sed -n 's/.*(floor \([0-9.]*\))$/\1/p' deps-info.txt)"
          have="$(pkg-config --modversion libuv)"
          if [ -z "$floor" ]; then
            echo "::error::could not read the floor out of make deps-info" >&2
            exit 1
          fi
          if [ "$source" != pkg-config ]; then
            echo "::error::the build took the '$source' path: the system libuv ($have) does not meet the floor ($floor)" >&2
            exit 1
          fi
          if [ "${have%.*}" != "${floor%.*}" ]; then
            echo "::error::the system libuv is $have, not the floor's ${floor%.*}.x ($floor)" >&2
            exit 1
          fi
          echo "links the libuv floor: system libuv $have, floor $floor"

      - name: Test (pkg-config path)
        run: make test
