name: CI

# Linux is the gate for every memory claim (ADR-0003). LeakSanitizer does not
# exist on macOS/ARM64, so a green macOS run is NOT evidence of no leaks --
# only Valgrind on Linux can support that claim. macOS is still tested because
# it is the primary development platform.
#
# Both acquisition paths are exercised on every run (ADR-0001): pkg-config
# and the pinned vendored submodule. Nothing here treats the vendored path as
# an afterthought -- it is Windows's eventual primary path (ADR-0004) too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (vendored + valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            chezscheme valgrind cmake pkg-config build-essential libuv1-dev

      # Recorded rather than asserted: the project's documented libuv floor
      # came from one developer's machine, not from testing. Whatever this
      # prints is what the suite is actually verified against.
      - name: Report versions
        run: |
          echo "chez:     $(chezscheme --version 2>&1 || scheme --version 2>&1)"
          echo "valgrind: $(valgrind --version)"
          echo "cmake:    $(cmake --version | head -1)"
          echo "cc:       $(cc --version | head -1)"
          echo "--- pkg-config visibility of libuv ---"
          pkg-config --exists libuv && echo "present: $(pkg-config --modversion libuv)" \
                                     || echo "absent (the vendored path covers this)"

      # Ubuntu names the binary `chezscheme`; the Makefile defaults to `chez`.
      - name: Resolve the Chez binary
        run: |
          if command -v chez >/dev/null; then echo "CHEZ=chez" >> "$GITHUB_ENV"
          elif command -v chezscheme >/dev/null; then echo "CHEZ=chezscheme" >> "$GITHUB_ENV"
          elif command -v scheme >/dev/null; then echo "CHEZ=scheme" >> "$GITHUB_ENV"
          else echo "no Chez Scheme binary found" >&2; exit 1; fi

      # The chez-srfi submodule and Akku.lock must name the same commit, and
      # the vendored libuv submodule must fall inside the version range this
      # binding validates at init -- and README.org must state the floor
      # that range is built from. They drifted once already, silently
      # (AGENTS.md's "prefer a check to a comment").
      - name: Check dependency pins agree
        run: make check-pins

      - name: Scheme dependencies
        run: make deps

      - name: Build (pkg-config path)
        run: make build

      - name: Test (pkg-config path)
        run: make test

      - name: Build vendored libuv
        run: make HAVE_PKG=no vendor

      - name: Build (vendored path)
        run: make HAVE_PKG=no build

      # The Makefile's $(ACQ_STAMP) plus `relink-guard` force a relink here:
      # without them, the pkg-config-linked shim above would still be sitting
      # in build/lib and this step would silently test the SAME artifact
      # twice instead of the vendored one. The stamp alone is not enough --
      # it compares mtimes, and make 3.81 does that at one-second granularity
      # (see the guard's comment in the Makefile); this runner's make 4.x
      # would have got away with it.
      - name: Check purity of native-free suites (vendored path)
        run: make HAVE_PKG=no check-purity

      - name: Test (vendored path)
        run: make HAVE_PKG=no test

      # The reason this job exists. Valgrind needs no instrumentation of Chez
      # or libuv and is the only tool in this project that can substantiate a
      # leak claim. Failure here blocks merge.
      - name: Memory (valgrind)
        run: make HAVE_PKG=no test-memory

      # `make test` reporting success on a failing suite would silently void
      # every other check in this workflow, so verify the contract itself.
      # conditions/native/loop are the suites Tasks 4-6 will add; none exist
      # yet at Stage 1a, so this loop has nothing to assert on for
      # suite-masking today and only exercises "make test fails on a failing
      # suite" -- it checks for each file's EXISTENCE at run time, not at the
      # time this workflow was written, so it starts covering suite-masking
      # automatically as they land, with no further edit here.
      - name: Verify the test target fails on a failing suite
        run: |
          mkdir -p tests
          cat > tests/test-aaci-sabotage.sps <<'EOF'
          #!r6rs
          (import (rnrs) (srfi :64))
          (define runner (test-runner-simple))
          (test-runner-current runner)
          (test-begin "ci-sabotage")
          (test-equal "deliberate failure" 1 2)
          (test-end "ci-sabotage")
          (exit (if (zero? (test-runner-fail-count runner)) 0 1))
          EOF
          if make HAVE_PKG=no test > sabotage.log 2>&1; then
            echo "::error::make test exited 0 with a failing suite present"
            rm -f tests/test-aaci-sabotage.sps
            exit 1
          fi
          # A first-position failure (test-aaci-sabotage sorts before every
          # real suite name) must not mask suites that run after it. The
          # test loop's own "=== tests/test-<name>.sps ===" line is a marker
          # it always prints per suite, win or lose, so grepping for it does
          # not depend on that suite having passed.
          for s in conditions native loop; do
            if [ -f "tests/test-$s.sps" ]; then
              grep -q "tests/test-$s.sps" sabotage.log \
                || { echo "::error::suite $s did not run after an earlier failure"; rm -f tests/test-aaci-sabotage.sps; exit 1; }
            else
              echo "tests/test-$s.sps does not exist yet -- skipping (covered automatically once it lands)"
            fi
          done
          rm -f tests/test-aaci-sabotage.sps
          echo "test target correctly failed, and no suite was masked"

      # LAST, because it starts with `make clean`. A release guard that never
      # runs in CI is a comment: this is the step that proves `make prod`
      # really produces a counters-free shim (tests/check-prod.sps fails
      # unless every counter reads zero while a loop and a bound tcp handle
      # are demonstrably alive) and that the following `make build` relinks
      # the dev artifact back, rather than leaving a release build in place
      # for dev callers. pkg-config is present on this runner, so `prod`
      # links against the system libuv and rebuilds nothing vendored.
      - name: Release build guard (make prod -> check-prod)
        run: |
          make prod
          make build
          if make check-prod; then
            echo "::error::check-prod passed against a dev shim"
            exit 1
          fi
          echo "check-prod correctly refused the dev shim"

  macos:
    name: macos (pkg-config + vendored, no leak claim)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: brew install chezscheme libuv cmake pkg-config

      - name: Report versions
        run: |
          echo "chez:  $(chez --version 2>&1)"
          echo "pkg-config libuv: $(pkg-config --modversion libuv)"

      - name: Scheme dependencies
        run: make deps

      # `test` depends on `check-pins`, so both legs below also cover pin
      # agreement -- no separate step needed (matches the linux job's
      # explicit "make check-pins", just reached through the prerequisite
      # instead, since macOS runs no step that would otherwise exercise it
      # before the first `make test`).
      - name: Build and test (pkg-config path)
        run: |
          make build
          make test

      - name: Build and test (vendored path)
        run: |
          make HAVE_PKG=no vendor
          make HAVE_PKG=no build
          make HAVE_PKG=no test

      # ASan only. LeakSanitizer is unsupported on macOS/ARM64, so this catches
      # use-after-free and overflows but CANNOT support a leak claim. Do not
      # read a green result here as "no leaks" -- that is the Linux job's job.
      - name: Memory (ASan, no leak detection)
        run: make test-memory

      # Same guard as the linux job, and it is worth running on both: the
      # relink it depends on is a make-version-sensitive question (macOS
      # ships make 3.81, whose one-second mtime granularity is what
      # `relink-guard` exists to defeat). LAST, because `prod` starts with
      # `make clean`.
      - name: Release build guard (make prod -> check-prod)
        run: |
          make prod
          make build
          if make check-prod; then
            echo "::error::check-prod passed against a dev shim"
            exit 1
          fi
          echo "check-prod correctly refused the dev shim"
