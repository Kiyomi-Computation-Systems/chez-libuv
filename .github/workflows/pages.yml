name: Pages

# Renders docs/ into build/site/ (`make site`, gated by `make check-site`)
# and deploys it to GitHub Pages on a release tag, or by hand. It commits
# nothing: build/site/ is made fresh here and handed to
# actions/deploy-pages as an artifact.
#
# The site needs Chez and the system cmark-gfm library, not libuv or the
# shim, so this job builds neither. Ubuntu's chezscheme is below the
# library's own floor, which is fine here: nothing imports (libuv).
# chez-cmark-gfm comes from the archive Akku.lock pins (`make site-deps`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A second tag pushed while one runs queues
# rather than tearing a deployment out from under a reader.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Chez and cmark-gfm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends chezscheme cmark-gfm

      - name: Get chez-cmark-gfm as Akku.lock pins it
        run: make site-deps

      # SITE_REF is the pushed tag (or the ref picked for a manual run), so
      # links out of the site to repository files pin to this release.
      - name: Gate the site
        run: make check-site CHEZ=chezscheme SITE_REF="${GITHUB_REF_NAME}"

      - name: Build the site
        run: make site CHEZ=chezscheme SITE_REF="${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
